# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: 05-multi_lambda_crud_with_api_gateway

on: 
  workflow_dispatch:                
  push:
    paths:
      - '05-multi_lambda_crud_with_api_gateway/**'
      - '.github/workflows/05-multi_lambda_crud_with_api_gateway.yaml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 05-multi_lambda_crud_with_api_gateway/golang
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Printing Folder
        run: ls

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 05-multi_lambda_crud_with_api_gateway/golang/go.mod

      # Catches mistakes the compiler allows: wrong Printf verbs, ignored
      # results, struct tags that do not parse.
      - name: Vet
        run: go vet ./...

      # gofmt -l lists unformatted files but always exits 0, so it can never
      # fail a build on its own. test -z fails when that list is not empty,
      # and the || branch re-runs it so the log names the offending files.
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Test
        run: go test ./... -race -cover -v

      - name: Build
        run: ./build.sh

      - name: Check build
        run: cd build && tree

        
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: 05-multi_lambda_crud_with_api_gateway/terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3 

      - name: Check formatting
        run: terraform fmt -check

      # -backend=false skips state entirely - this only downloads providers
      # so validate has schemas to check against.
      - name: Init
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate